# ========================
# 服务配置
# ========================
server:
  port: 8181
  servlet:
    context-path: /
    # 异步请求超时（AI 流式输出必需）
    async:
      request-timeout: 3600000  # 3600 秒 = 1 小时
  tomcat:
    accept-count: 100
    connection-timeout: 120000  # 连接超时 120 秒
    # Tomcat 连接器超时配置
    threads:
      max: 200
      min-spare: 10
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain

# ========================
# Actuator 端点配置
# ========================
# 显式声明只暴露安全端点，防止 Spring Boot 版本升级时默认值变化带来意外。
# 配合 SecurityConfig 中 /actuator/** 需 ADMIN 角色的双重防护。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 健康详情仅授权用户可见（防止泄露数据库/Redis 等组件连接状态）
      show-details: when-authorized

# ========================
# 数据源 - MySQL + HikariCP
# ========================
spring:
  profiles:
    active: ${PROFILE_ACTIVE:dev}
  config:
    import: classpath:tts-voices.yml
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:kbook-dev}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: KBookHikariCP

  # ========================
  # JPA
  # ========================
  jpa:
    hibernate:
      # 现阶段保留 update：历史 schema 由 Hibernate 自动维护
      # Flyway baseline 之后逐步用 V*__*.sql 管理 schema 演进
      # 待 schema 稳定后切换为 validate，由 Flyway 作为唯一真相源
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  # ========================
  # Flyway
  # ========================
  # baseline-on-migrate=true：现有数据库首次启动时打 V0 基线，不改动已有 schema
  # 后续 V1+ 迁移脚本位于 classpath:db/migration，逐步接管 schema 演进
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: true

  # ========================
  # Redis
  # ========================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DB:4}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  # ========================
  # FreeMarker（邮件模板渲染）
  # ========================
  freemarker:
    suffix: .ftl
    cache: false

  # ========================
  # 邮件
  # ========================
  mail:
    host: smtp.qq.com
    protocol: smtp
    port: 465
    username: ${MAIL_USERNAME:aa@bb.com}
    password: ${MAIL_PASSWORD:123456}
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
          starttls:
            enable: true

  # ========================
  # Elasticsearch
  # ========================
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9201}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
    connection-timeout: 30s
    socket-timeout: 120s



# ========================
# JWT 配置
# ========================
jwt:
  secret: ${JWT_SECRET:kbook-default-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}      # 15分钟（短时效缩小 XSS 窃取后的冒用窗口，refresh token 兜底）
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:2592000000} # 30天

# ========================
# 验证码配置
# ========================
verification:
  code-length: 6
  expire-minutes: 5
  rate-limit-seconds: 60
  daily-limit: 10

# ========================
# 邮件通知配置
# ========================
notification:
  # 网站域名，用于生成邀请链接等
  base-url: ${NOTIFICATION_BASE_URL:https://book.keiskei.top}
  # 邀请配置
  invitation:
    expire-hours: 72  # 邀请链接有效期（小时）
  # 书评回复通知阈值（阶梯）
  comment-reply-thresholds: 10, 50, 100
  # 书评点赞通知阈值（阶梯）
  comment-like-thresholds: 10, 50, 100, 500
  send-enabled: true

# ========================
# 日志
# ========================
# ========================
# 初始管理员配置
# ========================
kbook:
  # 辩论深度增强总开关（默认关闭，关闭时辩论链路与改造前等价）
  debate:
    deep-enabled: ${BOOK_DEBATE_DEEP_ENABLED:false}
  # CORS 允许的 Origin 模式（逗号分隔）
  # 安全要求：禁止使用 http://*:* 等通配符模式（等同 Origin 反射）
  # 开发环境默认：本机任意端口
  # 生产环境必须覆盖为具体域名，例如：
  #   allowed-origin-patterns: https://book.keiskei.top,https://www.book.keiskei.top
  cors:
    allowed-origin-patterns: ${KBOOK_CORS_ORIGINS:http://localhost,http://localhost:*,http://127.0.0.1,http://127.0.0.1:*}
  admin:
    email: ${KBOOK_ADMIN_EMAIL:admin@kbook.com}
    password: ${KBOOK_ADMIN_PASSWORD:admin123456}
    # 单书读者画像的隐私与显著性阈值（设计文档 4.1：上线前需按生产库分布校准）
    book-profile:
      min-cohort-size: ${KBOOK_PROFILE_MIN_COHORT_SIZE:10}
      min-bucket-size: ${KBOOK_PROFILE_MIN_BUCKET_SIZE:5}
      significant-min-count: ${KBOOK_PROFILE_SIGNIFICANT_MIN_COUNT:10}
      highlight-min-count: ${KBOOK_PROFILE_HIGHLIGHT_MIN_COUNT:20}
      # cohort 阈值的运行时自适应：min-cohort-size 是硬下界，作业按 A.3 那条 20% 规则只会往上收紧
      threshold-auto: ${KBOOK_PROFILE_THRESHOLD_AUTO:true}
      threshold-calibration-cron: ${KBOOK_PROFILE_THRESHOLD_CALIBRATION_CRON:0 40 3 * * *}
      # 两份缓存的寿命，默认与 §7.4 一致；调小只用于本地复现附录 Q 的分子分母龄期差
      profile-cache-minutes: ${KBOOK_PROFILE_CACHE_MINUTES:5}
      baseline-cache-minutes: ${KBOOK_PROFILE_BASELINE_CACHE_MINUTES:10}
  # AI 外部配置文件路径
  # - 本地开发默认读取项目根目录 deploy/ai-config.json（单文件维护）
  # - Docker 通过 AI_CONFIG_PATH 环境变量覆盖
  # - 以上都失败时自动回退 classpath:config/ai-config.json
  ai-config:
    path: ${AI_CONFIG_PATH:file:../deploy/ai-config.json}
  # 图书文件存储路径
  # 默认值为容器路径，本地开发通过 application-dev.yml 或 .env 覆盖
  book-paths:
    epub: ${BOOK_PATH_EPUB:/data/books/epub}
    pdf: ${BOOK_PATH_PDF:/data/books/pdf}
    txt: ${BOOK_PATH_TXT:/data/books/txt}
  # 封面图片存储路径
  cover-path: ${BOOK_COVER_PATH:/data/covers}
  # 上传文件配置
  upload:
    avatar-dir: ${AVATAR_DIR:/data/avatars}
    avatar-url-prefix: /api/user/avatar
    chat-dir: ${CHAT_DIR:/data/chat}
    chat-url-prefix: /api/chat/files
  # TTS 音频缓存目录
  tts-cache-dir: ${TTS_CACHE_DIR:/data/tts_cache}
  # 视频处理（需安装 FFmpeg）
  video:
    ffmpeg-path: ${FFMPEG_PATH:/usr/bin/ffmpeg}
    thumbnail:
      enabled: false
      width: 320
      quality: 3
    transcode:
      enabled: false
      max-width: 1280
      crf: 23
      audio-codec: aac
  # ========================
  # Qdrant 向量数据库
  # ========================
  qdrant:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_PORT:6334}
    api-key: ${QDRANT_API_KEY:}
    # 书籍元数据向量集合（标题+作者+标签+简介 → embedding）
    book-collection: kbook_books
    # RAG 内容向量集合（书籍内容分块 → embedding）
    content-collection: kbook_content
    # 向量维度（需与 embedding 模型输出维度一致：qwen3-embedding 系列均为 1024）
    vector-dimension: ${QDRANT_VECTOR_DIMENSION:1024}
    # RAG 内容分块大小（字符数）
    # 建议值：embedding 模型上下文越长 → 分块可越大；模型越小 → 分块应越小
    # bge-m3:latest (8K tokens) → 建议 512~800；qwen3-embedding:4b/8b → 建议 800~1200
    chunk-size: ${QDRANT_CHUNK_SIZE:800}
    # RAG 内容分块重叠大小（字符数），建议为 chunk-size 的 15%~25%
    chunk-overlap: ${QDRANT_CHUNK_OVERLAP:200}
    # RAG 检索返回的最大片段数（top-k）
    # 聊天模型上下文越短 → 此值应越小，避免 prompt 超出上下文长度
    # 估算：top-k × chunk-size × 1.5(中文token比) ≈ 注入 prompt 的 token 数
    # 例：16K上下文 → 5×512×1.5≈3840 tokens，加上系统提示+书籍信息+输出，约 7~9K，安全
    #     32K上下文 → 可用 8~10
    rag-top-k: ${QDRANT_RAG_TOP_K:100}
    # RAG 上下文注入的字符上限（0 = 不额外限制，按模型上下文窗口推导）。
    # 模型能吃下 512K tokens ≠ 该把整本书塞进提示词；不设上限时整本书（约 12 万字、84K tokens）会进上下文。
    # 该值必须用黄金集 A/B 验证后再定默认值，不要直接拍。
    rag-max-chars: ${QDRANT_RAG_MAX_CHARS:0}
    # 绝对相似度阈值：常规检索 topScore 低于此值且问题为书内事实时拒答；0 = 关闭（需黄金集标定）
    absolute-min-score: ${QDRANT_ABSOLUTE_MIN_SCORE:0.0}
    # LLM rerank：默认关闭；开启后每轮增加多次 TOOL 调用，需先压测延迟与成本
    rerank-enabled: ${QDRANT_RERANK_ENABLED:false}
    rerank-top-n: ${QDRANT_RERANK_TOP_N:30}
    # 原始向量是否存磁盘（默认 true，大幅节省内存；关闭则常驻 RAM 加速搜索但内存占用极大）
    vectors-on-disk: ${QDRANT_VECTORS_ON_DISK:true}
    # 标量量化配置：float32 → int8，内存占用降约 75%，精度损失 <1%
    quantization:
      enabled: ${QDRANT_QUANTIZATION_ENABLED:true}
      quantile: ${QDRANT_QUANTIZATION_QUANTILE:0.99}    # 分位数，裁剪异常值
      always-ram: ${QDRANT_QUANTIZATION_ALWAYS_RAM:false} # 量化向量常驻 RAM（关闭可大幅节省内存，搜索稍慢）
  # ========================
  # 图书问答按书规模分档路由（见 docs/plans/book-qa-scale-aware-routing-plan.md §2 / P1-1）
  # 灰度总开关默认关闭：关闭时全量走现有 RAG 链路，与改造前逐字节等价。
  # 阈值均为起步值，必须用 docs/eval/golden-set.real.jsonl 做 A/B 标定后再改默认。
  # ========================
  book-qa:
    scale-routing-enabled: ${BOOK_QA_SCALE_ROUTING_ENABLED:false}
    small-book-ratio: ${BOOK_QA_SMALL_BOOK_RATIO:0.6}
    safety-margin-ratio: ${BOOK_QA_SAFETY_MARGIN_RATIO:0.15}
    full-text-max-chars: ${BOOK_QA_FULL_TEXT_MAX_CHARS:400000}
    char-per-token: ${BOOK_QA_CHAR_PER_TOKEN:1.5}
    session-lock-enabled: ${BOOK_QA_SESSION_LOCK_ENABLED:true}
    medium-chapter-max-chars: ${BOOK_QA_MEDIUM_CHAPTER_MAX_CHARS:60000}
    list-pipeline-enabled-for-full-text: ${BOOK_QA_LIST_PIPELINE_FOR_FULL_TEXT:false}
    session-lock-max-size: ${BOOK_QA_SESSION_LOCK_MAX_SIZE:10000}
    # P2-3：向量库不再存全书原文（改为章节/位置/主题定位 + 本地按偏移还原）。
    # 开启后必须重建内容向量；默认关闭，保证与历史 A/B 报告口径一致。
    payload-desensitization-enabled: ${BOOK_QA_PAYLOAD_DESENSITIZATION:false}
    full-text-cache-max-size: ${BOOK_QA_FULL_TEXT_CACHE_MAX_SIZE:8}
    # P2-6：候选池内 BM25 词法重排（桌面化 Lucene 倒排索引落地前的可用形态）
    hybrid-retrieval-enabled: ${BOOK_QA_HYBRID_RETRIEVAL:false}
    hybrid-lexical-weight: ${BOOK_QA_HYBRID_LEXICAL_WEIGHT:0.35}
    hybrid-candidate-multiplier: ${BOOK_QA_HYBRID_CANDIDATE_MULTIPLIER:2}
    # 合规第 3 道防线：答案里连续 30 字与原文重合时替换为「〔原文从略〕」
    answer-overlap-guard-enabled: ${BOOK_QA_ANSWER_OVERLAP_GUARD:false}
    answer-overlap-min-chars: ${BOOK_QA_ANSWER_OVERLAP_MIN_CHARS:30}
    answer-overlap-source-max-chars: ${BOOK_QA_ANSWER_OVERLAP_SOURCE_MAX_CHARS:400000}
    # 表达层：分块数量由内容决定，块内句子可推导，去掉「结论 + 论据排队」的 AI 议论文腔；
    # 只写判定标准，不列连接词清单、不给过渡句式模板，避免模型照单抓药生成新模板腔。
    # 纯 SystemMessage 文案改动，不碰检索/阈值/预算；设 false 可逐字节回到旧提示词做 A/B。
    linear-speech-enabled: ${BOOK_QA_LINEAR_SPEECH_ENABLED:true}
  # ========================
  # AI 视觉模型配置（PDF OCR 专用）
  # 默认使用本地 Ollama 的 Unlimited-OCR:Q4_K_M 模型，避免云端模型（如 Gemini）对 data URI 的兼容性问题。
  # 如果 base-url 和 model-name 都留空，则回退到 CHAT-QA 配置。
  # 注意：默认值含冒号(:)必须用引号包裹，否则 Spring 占位符解析会把冒号当成分隔符导致默认值丢失。
  # ========================
  ai:
    # AI 用量明细保留天数；<=0 表示永久保留（每天凌晨清理）
    usage-retention-days: ${AI_USAGE_RETENTION_DAYS:365}
    # 每个 LLM 请求首部注入随机 nonce，彻底关闭 provider 端提示词/响应缓存；embedding/TTS 不受影响
    # 默认关闭：该层是 2026-11-01 的临时排查手段（见 docs/plans/ai-cache-bust-plan.md §5
    # 「排查结束后可直接关闭恢复原有缓存收益」）。图书问答的静态书籍前缀需要 provider 端缓存。
    # 离线评测必须显式置 true：KBOOK_AI_CACHE_BUST_ENABLED=true，否则相同 prompt 命中缓存会污染 A/B 结论。
    cache-bust-enabled: ${KBOOK_AI_CACHE_BUST_ENABLED:false}
    vision:
      provider: ${AI_VISION_PROVIDER:OLLAMA}
      base-url: ${AI_VISION_BASE_URL:http://192.168.1.10:11434}
      model-name: ${AI_VISION_MODEL:frob/unlimited-ocr:Q8_0}
      timeout: ${AI_VISION_TIMEOUT:600s}
# ========================
# 日志
# ========================
logging:
  level:
    root: INFO
    com.kbook: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    # LangChain4j 内部日志（调试 AI 请求/响应/耗时）
    dev.langchain4j: DEBUG
    # Ollama HTTP 客户端日志（查看实际请求和响应内容）
    dev.langchain4j.model.ollama: DEBUG

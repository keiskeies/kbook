# ========================
# 服务配置
# ========================
server:
  port: 8181
  servlet:
    context-path: /
    # 异步请求超时（AI 流式输出必需）
    async:
      request-timeout: 3600000  # 3600 秒 = 1 小时
  tomcat:
    accept-count: 100
    connection-timeout: 120000  # 连接超时 120 秒
    # Tomcat 连接器超时配置
    threads:
      max: 200
      min-spare: 10
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain

# ========================
# 数据源 - MySQL + HikariCP
# ========================
spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:kbook-dev}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: KBookHikariCP

  # ========================
  # JPA
  # ========================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  # ========================
  # Redis
  # ========================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DB:4}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  # ========================
  # 邮件
  # ========================
  mail:
    host: smtp.qq.com
    protocol: smtp
    port: 465
    username: ${MAIL_USERNAME:aa@bb.com}
    password: ${MAIL_PASSWORD:123456}
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
          starttls:
            enable: true

  # ========================
  # Elasticsearch
  # ========================
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9201}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
    connection-timeout: 30s
    socket-timeout: 120s



# ========================
# JWT 配置
# ========================
jwt:
  secret: ${JWT_SECRET:test}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:7200000}     # 2小时
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7天

# ========================
# 验证码配置
# ========================
verification:
  code-length: 6
  expire-minutes: 5
  rate-limit-seconds: 60
  daily-limit: 10

# ========================
# 邮件通知配置
# ========================
notification:
  # 网站域名，用于生成邀请链接等
  base-url: ${NOTIFICATION_BASE_URL:https://book.keiskei.top}
  # 邀请配置
  invitation:
    expire-hours: 72  # 邀请链接有效期（小时）
  # 书评回复通知阈值（阶梯）
  comment-reply-thresholds: 10, 50, 100
  # 书评点赞通知阈值（阶梯）
  comment-like-thresholds: 10, 50, 100, 500
  send-enabled: true

# ========================
# 日志
# ========================
# ========================
# 初始管理员配置
# ========================
kbook:
  admin:
    email: ${KBOOK_ADMIN_EMAIL:admin@kbook.com}
    password: ${KBOOK_ADMIN_PASSWORD:admin123456}
  # 图书文件存储路径
  book-paths:
    epub: ${BOOK_PATH_EPUB:G:/图书/epub}
    pdf: ${BOOK_PATH_PDF:G:/图书/pdf1}
    txt: ${BOOK_PATH_TXT:G:/图书/txt1}
  # 封面图片存储路径
  cover-path: ${BOOK_COVER_PATH:G:/图书/covers}
  # 上传文件配置
  upload:
    avatar-dir: ${AVATAR_DIR:G:/uploads/avatars}
    avatar-url-prefix: /api/user/avatar
    chat-dir: ${CHAT_DIR:G:/uploads/chat}
    chat-url-prefix: /api/chat/files
  # TTS 音频缓存目录
  tts-cache-dir: ${TTS_CACHE_DIR:G:/图书/tts_temp}
  # 视频处理（需安装 FFmpeg）
  video:
    ffmpeg-path: ${FFMPEG_PATH:C:/Program Files/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe}
    thumbnail:
      enabled: false
      width: 320
      quality: 3
    transcode:
      enabled: false
      max-width: 1280
      crf: 23
      audio-codec: aac
  # ========================
  # Qdrant 向量数据库
  # ========================
  qdrant:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_PORT:6334}
    api-key: ${QDRANT_API_KEY:}
    # 书籍元数据向量集合（标题+作者+标签+简介 → embedding）
    book-collection: kbook_books
    # RAG 内容向量集合（书籍内容分块 → embedding）
    content-collection: kbook_content
    # 向量维度（需与 embedding 模型输出维度一致：qwen3-embedding 系列均为 1024）
    vector-dimension: ${QDRANT_VECTOR_DIMENSION:1024}
    # RAG 内容分块大小（字符数）
    # 建议值：embedding 模型上下文越长 → 分块可越大；模型越小 → 分块应越小
    # bge-m3:latest (8K tokens) → 建议 512~800；qwen3-embedding:4b/8b → 建议 800~1200
    chunk-size: ${QDRANT_CHUNK_SIZE:800}
    # RAG 内容分块重叠大小（字符数），建议为 chunk-size 的 15%~25%
    chunk-overlap: ${QDRANT_CHUNK_OVERLAP:200}
    # RAG 检索返回的最大片段数（top-k）
    # 聊天模型上下文越短 → 此值应越小，避免 prompt 超出上下文长度
    # 估算：top-k × chunk-size × 1.5(中文token比) ≈ 注入 prompt 的 token 数
    # 例：16K上下文 → 5×512×1.5≈3840 tokens，加上系统提示+书籍信息+输出，约 7~9K，安全
    #     32K上下文 → 可用 8~10
    rag-top-k: ${QDRANT_RAG_TOP_K:100}
    # 原始向量是否存磁盘（默认 true，大幅节省内存；关闭则常驻 RAM 加速搜索但内存占用极大）
    vectors-on-disk: ${QDRANT_VECTORS_ON_DISK:true}
    # 标量量化配置：float32 → int8，内存占用降约 75%，精度损失 <1%
    quantization:
      enabled: ${QDRANT_QUANTIZATION_ENABLED:true}
      quantile: ${QDRANT_QUANTIZATION_QUANTILE:0.99}    # 分位数，裁剪异常值
      always-ram: ${QDRANT_QUANTIZATION_ALWAYS_RAM:false} # 量化向量常驻 RAM（关闭可大幅节省内存，搜索稍慢）
  # ========================
  # AI 视觉模型配置（PDF OCR 用）
  # 需支持图片输入的模型，如 Ollama 的 llava、gemma3n:e4b、minicpm-v 等
  # 如果留空，则使用下方 langchain4j.chat-model 的模型
  # ========================
  ai:
    vision-model-name: ${AI_VISION_MODEL:}
    vision-timeout: ${AI_VISION_TIMEOUT:600s}
# ========================
# AI 模型配置 (LangChain4j)
# 所有 AI 配置统一在此管理，修改后需重启服务生效
# ========================
# provider 支持 ollama（默认）和 openai
# OpenAI 兼容 API 示例（DeepSeek / 通义千问 / OpenAI 等）：
#   langchain4j.chat-model.provider=openai
#   langchain4j.chat-model.base-url=https://api.deepseek.com/v1
#   langchain4j.chat-model.api-key=sk-xxx
#   langchain4j.chat-model.model-name=deepseek-chat
# Ollama 示例（默认）：
#   langchain4j.chat-model.provider=ollama
#   langchain4j.chat-model.base-url=http://localhost:11434
#   langchain4j.chat-model.model-name=granite4.1:8b
langchain4j:
  chat-model:
    # 提供商：ollama | openai
    provider: ${AI_PROVIDER:ollama}
    base-url: ${AI_BASE_URL:http://localhost:11434}
    model-name: ${AI_MODEL:gemma4:e2b}
    # OpenAI 兼容 API 的 API Key（Ollama 无需填写）
    api-key: ${AI_API_KEY:}
    temperature: 0.7
    timeout: 600s
#  embedding-model:
#    # 提供商：ollama | openai
#    provider: ${AI_EMBEDDING_PROVIDER:openai}
#    base-url: ${AI_EMBEDDING_BASE_URL:https://ai.gitee.com/v1}
#    model-name: ${AI_EMBEDDING_MODEL:bge-m3}
#    # OpenAI 兼容 API 的 API Key（Ollama 无需填写）
#    api-key: ${AI_EMBEDDING_API_KEY:}
#    timeout: 300s
#    # 批量入库并发数（并行发送 embedding 请求的线程数）
#    concurrency: ${AI_EMBEDDING_CONCURRENCY:5}
  embedding-model:
    # 提供商：ollama | openai
    provider: ${AI_EMBEDDING_PROVIDER:ollama}
    base-url: ${AI_EMBEDDING_BASE_URL:http://localhost:11434}
    model-name: ${AI_EMBEDDING_MODEL:bge-m3:latest}
    # OpenAI 兼容 API 的 API Key（Ollama 无需填写）
    api-key: ${AI_EMBEDDING_API_KEY:}
    concurrency: ${AI_EMBEDDING_CONCURRENCY:20}
    timeout: 300s

# ========================
# 日志
# ========================
logging:
  level:
    root: INFO
    com.kbook: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    # LangChain4j 内部日志（调试 AI 请求/响应/耗时）
    dev.langchain4j: DEBUG
    # Ollama HTTP 客户端日志（查看实际请求和响应内容）
    dev.langchain4j.model.ollama: DEBUG

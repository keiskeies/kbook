# KBook 敏感配置 — 使用 kubectl 创建或 Helm values 注入
# 请勿将明文密码提交到版本控制系统
apiVersion: v1
kind: Secret
metadata:
  name: kbook-secrets
  namespace: kbook
type: Opaque
stringData:
  # MySQL
  MYSQL_USER: "root"
  MYSQL_PASSWORD: "kbook2024"
  # Redis
  REDIS_PASSWORD: "kbook2024"
  # JWT
  JWT_SECRET: "kbook-production-jwt-secret-must-be-at-least-256-bits-long"
  # AI 提供商（如需生产环境覆盖）
  AI_API_KEY: "sk-placeholder"
  # 邮件
  MAIL_USERNAME: "aa@bb.com"
  MAIL_PASSWORD: "placeholder"
  # 管理员
  KBOOK_ADMIN_EMAIL: "admin@kbook.com"
  KBOOK_ADMIN_PASSWORD: "admin123456"

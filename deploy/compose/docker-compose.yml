# ============================================================
# KBook Docker Compose — 单容器模式
# 启动：docker compose up -d
# 配置：同级 .env 文件（从 ../.env.example 复制）
# ============================================================

services:

  mysql:
    image: mysql:8.4.0
    container_name: kbook-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-kbook}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT_HOST:-3306}:3306"
    volumes:
      - ${MYSQL_DATA_DIR:-../data/mysql}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis/redis-stack:latest
    container_name: kbook-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - ${REDIS_DATA_DIR:-../data/redis}:/data
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - yes
      - --maxmemory
      - ${REDIS_MAX_MEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: kbook-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms${ES_HEAP_SIZE:-512m} -Xmx${ES_HEAP_SIZE:-512m}"
      - cluster.name=kbook
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${ES_PORT_HOST:-9200}:9200"
    volumes:
      - ${ES_DATA_DIR:-../data/es}:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: kbook-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ${QDRANT_DATA_DIR:-../data/qdrant}:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: kbook-app
    restart: unless-stopped
    ports:
      - "${APP_PORT_HOST:-80}:80"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
      TZ: ${TZ:-Asia/Shanghai}
      # ---- 数据库 ----
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-kbook}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # ---- Redis ----
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-4}
      # ---- ES / Qdrant ----
      ES_URIS: ${ES_URIS:-http://elasticsearch:9200}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      # ---- JWT（⚠️ 生产环境必改） ----
      JWT_SECRET: ${JWT_SECRET}
      # ---- AI 视觉模型（OCR 用，留空则使用对话模型） ----
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_VISION_TIMEOUT: ${AI_VISION_TIMEOUT:-600s}
      # ---- AI 配置 ----
      KBOOK_AI_CONFIG_PATH: /app/config/ai-config.json
      # ---- 文件路径（容器内） ----
      BOOK_PATH_EPUB: /data/books/epub
      BOOK_PATH_PDF: /data/books/pdf
      BOOK_PATH_TXT: /data/books/txt
      BOOK_COVER_PATH: /data/covers
      AVATAR_DIR: /data/avatars
      CHAT_DIR: /data/chat
      TTS_CACHE_DIR: /data/tts_cache
      # ---- 管理员 ----
      KBOOK_ADMIN_EMAIL: ${KBOOK_ADMIN_EMAIL:-admin@kbook.com}
      KBOOK_ADMIN_PASSWORD: ${KBOOK_ADMIN_PASSWORD}
      # ---- 邮件 ----
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      NOTIFICATION_BASE_URL: ${NOTIFICATION_BASE_URL:-https://book.keiskei.top}
    volumes:
      - ${BOOK_PATH_EPUB:-../data/books/epub}:/data/books/epub:ro
      - ${BOOK_PATH_PDF:-../data/books/pdf}:/data/books/pdf:ro
      - ${BOOK_PATH_TXT:-../data/books/txt}:/data/books/txt:ro
      - ${BOOK_COVER_PATH:-../data/covers}:/data/covers
      - ${AVATAR_DIR:-../data/avatars}:/data/avatars
      - ${CHAT_DIR:-../data/chat}:/data/chat
      - ${TTS_CACHE_DIR:-../data/tts_cache}:/data/tts_cache
      - ${AI_CONFIG_HOST:-../ai-config.json}:/app/config/ai-config.json:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes: {}

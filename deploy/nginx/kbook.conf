http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   180;
    types_hash_max_size 4096;
    proxy_connect_timeout 180s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_body_timeout 60;
    client_max_body_size 32m;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

#    upstream cpreading-img-server {
#        server 127.0.0.1:10001;
#       server 127.0.0.1:10002;
#    }


    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }


    # ============================================
    # ai-gateway.keiskei.top - AI 网关（静态文件）
    # ============================================
    server {
        listen 443 ssl;
        server_name ai-gateway.keiskei.top;

        # SSL 证书配置
        ssl_certificate /etc/letsencrypt/live/ai-gateway.keiskei.top-0002/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ai-gateway.keiskei.top-0002/privkey.pem;

        # SSL 安全优化配置
        ssl_session_timeout 5m;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 禁用重定向
        proxy_redirect off;

        # WebSocket 协议支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 传递客户端真实信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # 关闭缓冲
        proxy_buffering off;

        # 静态文件服务
        location / {
            root /opt/project/ai-gateway/www/;
            index index.html index.htm;
            autoindex off;
            try_files $uri $uri/ =404;
        }
    }


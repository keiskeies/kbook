[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/kbook-core",
    "crates/kbook-db",
    "crates/kbook-ai",
    "crates/kbook-parser",
    "crates/kbook-auth",
    "crates/kbook-config",
    "crates/kbook-vector",
]

[workspace.dependencies]
kbook-core = { path = "crates/kbook-core" }
kbook-db = { path = "crates/kbook-db" }
kbook-vector = { path = "crates/kbook-vector" }
kbook-ai = { path = "crates/kbook-ai" }
kbook-parser = { path = "crates/kbook-parser" }
kbook-auth = { path = "crates/kbook-auth" }
kbook-config = { path = "crates/kbook-config" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F0EEEA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="KBook - 智能阅读平台" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KBook" />
    <!--
      内容安全策略（CSP）— 从源头防 XSS 注入
      - script-src 'self'：只允许同源脚本，拦截外部脚本和 inline script 注入
      - 'unsafe-eval'：Vite dev 模式 esbuild 转换需要，prod 无影响（React 不用 eval）
      - style-src 'unsafe-inline'：React 的 style={{}} 依赖内联样式
      - img-src https:：书籍封面/用户头像可能来自任意 https 源
      - connect-src ws: wss:：SSE 长连接 + Vite HMR + 讯飞 WS
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>KBook</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
